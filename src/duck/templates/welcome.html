<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация успешна</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .checkmark {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #28a745;
            color: white;
            font-size: 40px;
            line-height: 70px;
            margin: 0 auto 20px;
            animation: pop 0.4s ease-out;
        }

        @keyframes pop {
            0%   { transform: scale(0); opacity: 0; }
            80%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .card h2 {
            margin: 0 0 10px;
            color: #333;
        }

        .card p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .card p .name {
            color: #28a745;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .timer {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body data-user-name="{{ name }}">

    <div class="card">
        <div class="checkmark">✓</div>
        <h2>Вы зарегистрированы!</h2>
        <p>Добро пожаловать, <span class="name" id="user-name">пользователь</span>!<br>
           Теперь вы можете войти в систему.</p>

        <button onclick="goToLogin()">Перейти ко входу</button>
        <div class="timer">Автоматический переход через <span id="countdown">5</span> сек.</div>
    </div>

    <script>
        var userName = document.body.getAttribute('data-user-name');
        if (userName) {
            document.getElementById('user-name').textContent = userName;
        }

        var seconds = 5;
        var counter = document.getElementById('countdown');

        var timer = setInterval(function() {
            seconds--;
            counter.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                goToLogin();
            }
        }, 1000);

        function goToLogin() {
            window.location.href = "/login";
        }
    </script>
</body>
</html>
